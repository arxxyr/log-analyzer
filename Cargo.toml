[workspace]
resolver = "2"
members = [
    "crates/analyzer-core",
    "crates/analyzer-cli",
    "plugins/master-control-analyzer",
    "plugins/cpp-demo-analyzer",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["loosqk"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# ABI 稳定性核心库
abi_stable = "0.11"

# 常用依赖
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI 相关
clap = { version = "4.5", features = ["derive"] }

# 插件加载
libloading = "0.8"

# 日志分析常用
regex = "1.12"
csv = "1.2"
chrono = { version = "0.4", features = ["serde"] }
plotters = "0.3"

[profile.release]
opt-level = 3
lto = "thin"           # 使用 thin LTO（插件架构下 full LTO 不适用）
codegen-units = 16     # 增加并行编译单元（插件模式下需要）
strip = true
panic = "abort"
