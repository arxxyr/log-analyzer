[package]
name = "master_control_analyzer"
version = "0.1.0"
edition = "2024"

[dependencies]
regex = "1.11.3"
csv = "1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
clap = { version = "4.5", features = ["derive"] }
plotters = "0.3"
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }

[profile.release]
opt-level = 3          # 最高优化级别
lto = true             # 链接时优化
codegen-units = 1      # 单代码生成单元，更好的优化
strip = true           # 移除符号信息
panic = "abort"        # panic时直接abort，减小二进制大小
