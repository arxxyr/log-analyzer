[workspace]
resolver = "2"
members = [
    "crates/analyzer-core",
    "crates/analyzer-cli",
    "crates/analyzer-remote",
    "crates/analyzer-workflow",
    "crates/analyzer-merger",
    "crates/analyzer-visualizer",
    "crates/analyzer-tui",
    "plugins/master-control-analyzer",
    "plugins/arm-decision-analyzer",
    "plugins/cpp-demo-analyzer",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["loosqk"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# ABI 稳定性核心库
abi_stable = "0.11"

# 常用依赖
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI 相关
clap = { version = "4.5.53", features = ["derive"] }

# 插件加载
libloading = "0.8"

# 日志分析常用
regex = "1.12.2"
csv = "1.4.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
plotters = "0.3"

# 日志记录
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"           # 使用 thin LTO（插件架构下 full LTO 不适用）
codegen-units = 16     # 增加并行编译单元（插件模式下需要）
strip = true
panic = "abort"
