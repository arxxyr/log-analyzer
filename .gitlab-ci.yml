# GitLab CI/CD 配置
# Rust workspace 项目的持续集成
# 不依赖 rust 官方镜像，在通用 Ubuntu 镜像中通过 rustup 安装

stages:
  - check
  - test
  - build

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  RUSTUP_HOME: ${CI_PROJECT_DIR}/.rustup
  RUSTFLAGS: "-D warnings"
  # 使用 nightly（edition 2024 需要）
  RUST_TOOLCHAIN: nightly
  # rustup 安装参数
  RUSTUP_INIT_SKIP_PATH_CHECK: "yes"

# 缓存 cargo 依赖、rustup 工具链和构建产物
.rust-cache: &rust-cache
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/
      - .cargo/git/
      - .rustup/
      - target/
    policy: pull-push

# 基础镜像配置：Ubuntu + 手动安装 Rust
.rust-base: &rust-base
  image: ubuntu:22.04
  before_script:
    # 安装系统依赖（ssh2 crate 需要 libssh2、openssl）
    - apt-get update -qq
    - apt-get install -y -qq curl build-essential pkg-config
        libssl-dev libssh2-1-dev cmake > /dev/null 2>&1
    # 安装 Rust（如已缓存则跳过下载）
    - export PATH="${CARGO_HOME}/bin:${PATH}"
    - |
      if ! command -v rustup &> /dev/null; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
          sh -s -- -y --default-toolchain ${RUST_TOOLCHAIN} --profile minimal
      fi
    - rustup default ${RUST_TOOLCHAIN}
    - rustup component add rustfmt clippy
    - rustc --version && cargo --version

# ============ Check 阶段 ============

# 代码格式检查
fmt:
  <<: *rust-base
  <<: *rust-cache
  stage: check
  script:
    - cargo fmt --all -- --check
  allow_failure: false

# Clippy 静态分析
clippy:
  <<: *rust-base
  <<: *rust-cache
  stage: check
  script:
    - cargo clippy --all --all-targets -- -D warnings
  allow_failure: false

# ============ Test 阶段 ============

# 单元测试
test:
  <<: *rust-base
  <<: *rust-cache
  stage: test
  script:
    - cargo test --all --release
  needs:
    - fmt
    - clippy

# ============ Build 阶段 ============

# Release 构建
build-release:
  <<: *rust-base
  <<: *rust-cache
  stage: build
  script:
    - cargo build --release
  artifacts:
    name: "analyzer-${CI_COMMIT_SHORT_SHA}"
    paths:
      - target/release/analyzer
      - target/release/*.so
    expire_in: 7 days
  needs:
    - test
  only:
    - main
    - master
    - tags
    - merge_requests

# Debug 构建（用于 MR 快速验证）
build-debug:
  <<: *rust-base
  <<: *rust-cache
  stage: build
  script:
    - cargo build
  needs:
    - fmt
    - clippy
  except:
    - main
    - master
    - tags
