# Analyzer 主配置文件
# 用途：定义远程连接、日志发现规则和插件映射

# 远程连接配置
remote:
  enabled: true
  host: "192.168.5.101"
  port: 22
  user: "linux"
  # 认证方式（优先级从高到低）
  auth:
    # 1. SSH 密钥（推荐）
    # key_file: "~/.ssh/id_rsa"
    # 2. SSH Agent
    # use_agent: true
    # 3. 密码（不推荐，可留空由运行时输入）
    password: "linux"

  # 日志目录配置
  log_dir: "/home/linux/.ros/log"

  # 超时配置（秒）
  timeouts:
    connect: 30
    transfer: 300

# 本地路径配置
local:
  log_dir: "./logs"
  output_dir: "./output"
  plugin_dir: "./plugins"

  # 是否在分析前清理旧输出
  cleanup_old_output: true

# 文件发现规则（支持本地和远程）
file_discovery:
  # 默认排序方式
  sort_by: "mtime"  # mtime(修改时间) | name(文件名) | size(文件大小)
  sort_order: "desc"  # desc(降序) | asc(升序)

  # 自动模式：自动选择最新/最旧的文件
  auto_select: "latest"  # latest | oldest | none

# 日志模式到插件的映射规则
analyzers:
  # 机器人主控日志（必需，作为主时间轴）
  - name: "master-control"
    pattern: "master_control_*.log"
    plugin: "master-control-analyzer"
    description: "机器人主控系统日志分析器"
    enabled: true
    required: true  # 标记为必需
    is_primary: true  # 标记为主时间轴
    # master_control 日志在日期子目录中（如 /home/linux/.ros/log/20251226/）
    use_latest_date_dir: true
    # 最多拉取和分析的文件数量（默认 1，CLI -n 参数可覆盖）
    max_files: 5
    # 插件特定配置（可选）
    config:
      detect_rounds: true
      generate_gantt: true

  # 外部导航日志（可选）
  - name: "external-navigation"
    pattern: "nav_*.log"
    plugin: "navigation-analyzer"
    description: "外部导航系统日志分析器"
    enabled: false
    required: false

  # 视觉系统日志（可选）
  - name: "vision"
    pattern: "vision_*.log"
    plugin: "vision-analyzer"
    description: "视觉系统日志分析器"
    enabled: false
    required: false

  # 通用日志（兜底）
  - name: "generic"
    pattern: "*.log"
    plugin: "generic-analyzer"
    description: "通用日志分析器"
    enabled: false
    required: false
    priority: -1  # 最低优先级

# 多文件分析配置（v0.4.0 新增）
multi_file:
  # 是否启用多文件分析模式
  enabled: true

  # 自动模式下同时下载的文件模式（按优先级）
  auto_patterns:
    - "master_control_*.log"  # 必需
    - "nav_*.log"             # 可选

  # 时间对齐配置
  alignment:
    # 主时间轴来源（必须匹配 analyzers 中标记 is_primary: true 的）
    primary_source: "master-control"

    # 时间容差（秒），用于对齐不同日志
    time_tolerance: 1.0

    # 对齐策略
    strategy: "timestamp"  # timestamp(直接时间戳) | event_based(基于事件特征)

  # 泳道优先级（控制甘特图中的显示顺序）
  track_priority:
    RoundMarker: 0
    Navigation: 1
    Arm: 2
    Head: 3
    Waist: 4

# 工作流配置
workflow:
  # 自动下载最新日志
  auto_download: true

  # 下载后是否自动分析
  auto_analyze: true

  # 失败重试
  retry:
    enabled: true
    max_attempts: 3
    delay_seconds: 5

  # 进度显示
  progress:
    show_progress_bar: true
    show_transfer_speed: true

# 日志配置
logging:
  level: "info"  # trace | debug | info | warn | error
  format: "compact"  # compact | full | json
  output: "stdout"  # stdout | file
  file: "./analyzer.log"

# 高级选项
advanced:
  # 并发下载数量（多个文件时）
  concurrent_downloads: 2

  # 缓存远程文件列表（秒）
  cache_remote_list: 60

  # 跳过已分析的文件（根据输出目录判断）
  skip_analyzed: false
