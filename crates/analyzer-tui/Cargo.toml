[package]
name = "analyzer-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "TUI 界面模块 - 提供交互式终端界面"

[dependencies]
# TUI 框架
ratatui = { workspace = true }
crossterm = { workspace = true }

# 异步运行时
tokio = { workspace = true }
