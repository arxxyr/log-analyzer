# GitHub Actions CI/CD 配置
# Rust workspace 项目的持续集成
# 版本格式: v主版本.次版本.修订号+日期.commit短哈希

name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ============ 代码检查 ============
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "clippy"

      - name: Run Clippy
        run: cargo clippy --all --all-targets -- -D warnings

  # ============ 测试 ============
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"

      - name: Run tests
        run: cargo test --all --release

  # ============ 构建 ============
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [test]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            exe_suffix: ""
            plugin_ext: "so"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            exe_suffix: ".exe"
            plugin_ext: "dll"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build-${{ matrix.os }}"

      # 生成版本信息
      - name: Generate version info
        id: version
        shell: bash
        run: |
          # 从 Cargo.toml 提取基础版本号
          BASE_VERSION=$(grep -A5 '^\[workspace\.package\]' Cargo.toml | grep '^version' | sed 's/.*= *"\([^"]*\)".*/\1/')
          echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT

          # 生成构建元数据: 日期.commit短哈希
          BUILD_DATE=$(date -u +%Y%m%d)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_META="${BUILD_DATE}.${SHORT_SHA}"
          echo "build_meta=$BUILD_META" >> $GITHUB_OUTPUT

          # 完整版本号
          FULL_VERSION="v${BASE_VERSION}+${BUILD_META}"
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT

          # 打包文件名
          PACKAGE_NAME="analyzer-${FULL_VERSION}-${{ matrix.platform }}"
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT

          echo "=== Version Info ==="
          echo "Base Version: $BASE_VERSION"
          echo "Build Meta: $BUILD_META"
          echo "Full Version: $FULL_VERSION"
          echo "Package Name: $PACKAGE_NAME"

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      # 打包产物
      - name: Package artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p package/plugins package/configs package/fonts

          # 复制可执行文件
          cp target/${{ matrix.target }}/release/analyzer package/

          # 复制插件
          cp target/${{ matrix.target }}/release/libmaster_control_analyzer.so package/plugins/ || true

          # 复制配置和字体
          cp -r configs/* package/configs/ || true
          cp -r fonts/* package/fonts/ || true

          # 写入版本信息
          echo "${{ steps.version.outputs.full_version }}" > package/VERSION

          # 创建压缩包
          cd package
          tar -czvf ../${{ steps.version.outputs.package_name }}.tar.gz .
          cd ..

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/plugins, package/configs, package/fonts

          # 复制可执行文件
          Copy-Item target/${{ matrix.target }}/release/analyzer.exe package/

          # 复制插件
          Copy-Item target/${{ matrix.target }}/release/master_control_analyzer.dll package/plugins/ -ErrorAction SilentlyContinue

          # 复制配置和字体
          Copy-Item configs/* package/configs/ -ErrorAction SilentlyContinue
          Copy-Item fonts/* package/fonts/ -ErrorAction SilentlyContinue

          # 写入版本信息
          "${{ steps.version.outputs.full_version }}" | Out-File -FilePath package/VERSION -Encoding UTF8

          # 创建压缩包
          Compress-Archive -Path package/* -DestinationPath "${{ steps.version.outputs.package_name }}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.package_name }}
          path: |
            ${{ steps.version.outputs.package_name }}.tar.gz
            ${{ steps.version.outputs.package_name }}.zip
          retention-days: 30

  # ============ Release 发布 ============
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 生成版本信息（与 build job 保持一致）
      - name: Generate version info
        id: version
        run: |
          # 从 tag 提取版本号
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT

          # 生成构建元数据
          BUILD_DATE=$(date -u +%Y%m%d)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_META="${BUILD_DATE}.${SHORT_SHA}"
          echo "build_meta=$BUILD_META" >> $GITHUB_OUTPUT

          # 完整版本号（用于 release 标题）
          FULL_VERSION="${TAG_VERSION}+${BUILD_META}"
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f -name "*.tar.gz" -o -name "*.zip" | head -20

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          echo "=== Release files ==="
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ steps.version.outputs.full_version }}"
          tag_name: ${{ steps.version.outputs.tag_version }}
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
          body: |
            ## 版本信息
            - **版本号**: ${{ steps.version.outputs.full_version }}
            - **构建日期**: $(date -u +%Y-%m-%d)
            - **Commit**: ${{ github.sha }}

            ## 下载
            - Linux x64: `analyzer-${{ steps.version.outputs.full_version }}-linux-x64.tar.gz`
            - Windows x64: `analyzer-${{ steps.version.outputs.full_version }}-windows-x64.zip`

  # ============ Dev 构建通知 ============
  dev-build-summary:
    name: Dev Build Summary
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Generate summary
        run: |
          echo "## Dev Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts are available for download from the Actions tab." >> $GITHUB_STEP_SUMMARY
