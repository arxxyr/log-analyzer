# GitHub Actions CI/CD 配置
# Rust workspace 项目的持续集成
# 版本格式: v主版本.次版本.修订号+日期.commit短哈希

name: CI

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: 0        # release 构建关闭增量，配合 LTO 优化
  CARGO_NET_RETRY: 10         # 网络重试次数
  RUST_BACKTRACE: short

jobs:
  # ============ 代码检查 ============
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --all --all-targets -- -D warnings

  # ============ 测试 ============
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [clippy]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all --release

  # ============ 构建 ============
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64（Ubuntu 22.04 LTS，glibc 2.35，兼容性好）
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            exe_suffix: ""
            plugin_ext: "so"
            plugin_prefix: "lib"
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            exe_suffix: ".exe"
            plugin_ext: "dll"
            plugin_prefix: ""
          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            exe_suffix: ""
            plugin_ext: "dylib"
            plugin_prefix: "lib"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # 生成版本信息
      - name: Generate version info
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(grep -A5 '^\[workspace\.package\]' Cargo.toml | grep '^version' | sed 's/.*= *"\([^"]*\)".*/\1/')
          echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            BUILD_META="${SHORT_SHA}"
            BUILD_TYPE="release"
          else
            BUILD_DATE=$(date -u +%Y%m%d)
            BUILD_META="${BUILD_DATE}.${SHORT_SHA}"
            BUILD_TYPE="dev"
          fi
          echo "build_meta=$BUILD_META" >> $GITHUB_OUTPUT
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT

          FULL_VERSION="v${BASE_VERSION}+${BUILD_META}"
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT

          PACKAGE_NAME="analyzer-${FULL_VERSION}-${{ matrix.platform }}"
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT

          echo "=== Version Info ==="
          echo "Build Type: $BUILD_TYPE"
          echo "Full Version: $FULL_VERSION"

      - name: Build release
        run: cargo build --release -p analyzer-cli -p master-control-analyzer --target ${{ matrix.target }}

      - name: Verify build artifacts
        shell: bash
        run: |
          echo "=== CLI ==="
          ls -lh "target/${{ matrix.target }}/release/analyzer${{ matrix.exe_suffix }}"
          echo "=== Plugin ==="
          ls -lh "target/${{ matrix.target }}/release/${{ matrix.plugin_prefix }}master_control_analyzer.${{ matrix.plugin_ext }}"

      # 验证插件 ELF 完整性（Linux）
      - name: Verify plugin ELF integrity
        if: runner.os == 'Linux'
        run: |
          PLUGIN="target/${{ matrix.target }}/release/${{ matrix.plugin_prefix }}master_control_analyzer.${{ matrix.plugin_ext }}"
          echo "=== 检查动态段 ==="
          readelf -d "$PLUGIN" | head -10
          if readelf -d "$PLUGIN" 2>&1 | grep -q "NEEDED"; then
            echo "✓ 插件 ELF 结构完整"
          else
            echo "✗ 插件 ELF 结构异常！"
            exit 1
          fi

      # UPX 压缩（Linux/Windows）
      - name: Install UPX (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install upx -y

      - name: Compress binaries with UPX
        if: runner.os != 'macOS'
        shell: bash
        run: |
          EXE="target/${{ matrix.target }}/release/analyzer${{ matrix.exe_suffix }}"
          PLUGIN="target/${{ matrix.target }}/release/${{ matrix.plugin_prefix }}master_control_analyzer.${{ matrix.plugin_ext }}"

          echo "=== 压缩前 ==="
          ls -lh "$EXE"
          ls -lh "$PLUGIN"

          # 只压缩主程序，不压缩插件 .so/.dll
          # UPX 对共享库的支持不完善，会破坏 ELF DYNAMIC 段的文件偏移，
          # 导致 dlopen 后符号解析失败引发 SIGSEGV
          upx --best --lzma "$EXE" || true

          echo "=== 压缩后 ==="
          ls -lh "$EXE"
          ls -lh "$PLUGIN"

      # 打包产物 (Linux/macOS)
      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p package/plugins package/configs package/fonts

          cp target/${{ matrix.target }}/release/analyzer package/

          PLUGIN_NAME="${{ matrix.plugin_prefix }}master_control_analyzer.${{ matrix.plugin_ext }}"
          cp "target/${{ matrix.target }}/release/${PLUGIN_NAME}" package/plugins/

          cp -r configs/* package/configs/ || true
          cp -r fonts/* package/fonts/ || true

          echo "${{ steps.version.outputs.full_version }}" > package/VERSION

          cd package
          tar -czvf ../${{ steps.version.outputs.package_name }}.tar.gz .
          cd ..

      # 打包产物 (Windows)
      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/plugins, package/configs, package/fonts

          Copy-Item target/${{ matrix.target }}/release/analyzer.exe package/

          $pluginName = "${{ matrix.plugin_prefix }}master_control_analyzer.${{ matrix.plugin_ext }}"
          Copy-Item "target/${{ matrix.target }}/release/$pluginName" package/plugins/

          Copy-Item configs/* package/configs/ -ErrorAction SilentlyContinue
          Copy-Item fonts/* package/fonts/ -ErrorAction SilentlyContinue

          "${{ steps.version.outputs.full_version }}" | Out-File -FilePath package/VERSION -Encoding UTF8

          Compress-Archive -Path package/* -DestinationPath "${{ steps.version.outputs.package_name }}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.package_name }}
          path: |
            ${{ steps.version.outputs.package_name }}.tar.gz
            ${{ steps.version.outputs.package_name }}.zip
          retention-days: 30

  # ============ Release 发布 ============
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 生成版本信息（Release 版只用 commit hash，不带日期）
      - name: Generate version info
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_META="${SHORT_SHA}"
          echo "build_meta=$BUILD_META" >> $GITHUB_OUTPUT

          FULL_VERSION="${TAG_VERSION}+${BUILD_META}"
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT

          BUILD_DATE=$(date -u +%Y-%m-%d)
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f -name "*.tar.gz" -o -name "*.zip" | head -20

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          echo "=== Release files ==="
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ steps.version.outputs.full_version }}"
          tag_name: ${{ steps.version.outputs.tag_version }}
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
          body: |
            ## 版本信息
            - **版本号**: ${{ steps.version.outputs.full_version }}
            - **构建日期**: ${{ steps.version.outputs.build_date }}
            - **Commit**: ${{ github.sha }}

            ## 下载
            - Linux x64: `analyzer-${{ steps.version.outputs.full_version }}-linux-x64.tar.gz`
            - Windows x64: `analyzer-${{ steps.version.outputs.full_version }}-windows-x64.zip`
            - macOS ARM64: `analyzer-${{ steps.version.outputs.full_version }}-macos-arm64.tar.gz`

  # ============ Dev 构建通知 ============
  dev-build-summary:
    name: Dev Build Summary
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - name: Generate summary
        run: |
          echo "## Dev Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts are available for download from the Actions tab." >> $GITHUB_STEP_SUMMARY
